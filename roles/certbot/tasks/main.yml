#    --redirect
#  when:
#    - ansible_os_family == "Debian"
#    - not collabora_cert_exists.stat.exists
#  changed_when: true

# Automaticly checks everyday if server needs a new cert. Hour: = what time during the day, minutes: = what minute it would happen
# If renewal is needed, apache will be reloaded and get the new cert
# Renewal attemps can be found in /var/log/certbot-renew.log
- name: Install certbot deploy hook script
  become: true
  ansible.builtin.template:
    src: certbot-deploy-hook.sh.j2
    dest: /usr/local/sbin/certbot-deploy-hook
    owner: root
    group: root
    mode: "0755"

- name: Automatic cert renewal
  become: true
  ansible.builtin.cron:
    name: "Certbot renewal"
    hour: "{{ certbot_renew_hour }}"      # which hour of the day the cert will be checked
    minute: "{{ certbot_renew_minute }}"  # which minute of the day the cert will be checked
    # check for cert in background and if found adds it and renfreces the website
    job: "certbot renew --quiet --deploy-hook /usr/local/sbin/certbot-deploy-hook >> /var/log/certbot-renew.log 2>&1"
    user: root
  when: certbot_auto_renew

# This will check the current state of the cert (expiry date)
- name: Verify certificate is valid
  ansible.builtin.command: "certbot certificates"
  register: cert_status
  changed_when: false                     # says to anisble that this task shouldn't change system state, only read it

# Prints the cert status in ansible
- name: Display certificate status
  ansible.builtin.debug:
    msg: "{{ cert_status.stdout_lines }}" # msg of info about cert
