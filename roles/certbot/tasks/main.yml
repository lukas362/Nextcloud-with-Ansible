# Here is where certbot will be downloaded and installed. Certbot will handel SSL cert for the server. HTTP -> HTTPS

---
# Installation of certbot and make sure it is the latest one
- name: Install Certbot and Apache plugin
  become: true
  ansible.builtin.apt:
    name:
      - certbot                             # Let's encrypt
      - python3-certbot-apache              # Plugin that helps with auto configuring SSL in Apache
    state: present                          # makes sure the packages is installed
#    update_cache: true                      # this will run update to check that it has the latest version

# Check if there is already a SSL certctification
- name: Check if there is already a cert
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ domains[0] }}/fullchain.pem"   # This is were the cert lives
  register: cert_exists

# Check if there is already a Collabora SSL certificate
# - name: Check if there is already a Collabora cert
#  ansible.builtin.stat:
#    path: "/etc/letsencrypt/live/{{ collabora_domain }}/fullchain.pem"
#  register: collabora_cert_exists

# Obtaining apache certification with some apache plugins
# certbot --apache = automaticky obtains and installs let's encrypt ssl cert for apache website
# -d {{ domains[0] }} = Adds the cert to the webbsite
# --agree-tos = Agrees to Let's Encrypt
# --non-interactive = Makes it so I don't have to agree to questions asked by Cerybot, will automatically agree
#  --email {{ certbot_email }} = Needed to make cert bot work
# --redirect = Sends traffic from http:// -> https://

- name: Get cert using Apache2 plugin
  ansible.builtin.command: >
    certbot --apache
    -d {{ domains[0] }}
    --agree-tos
    --non-interactive
    --email {{ certbot_email }}
    --redirect
  when:
    - ansible_os_family == "Debian"
    - not cert_exists.stat.exists       # If cert doesn't exist runs this command
  register: certbot_result
  changed_when: true

# Get certificate for Collabora
