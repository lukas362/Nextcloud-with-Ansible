# Removes the wopi_url config so Nextcloud doesn't point at a external server (comment out when wanna use external mode)
- name: Remove external richdocuments wopi_url in builtin mode
  ansible.builtin.command:
    cmd: php occ config:app:delete richdocuments wopi_url
  args:
    chdir: "{{ nextcloud_install_dir }}"
  become: true
  become_user: www-data
  changed_when: false
  when: collabora_mode == 'builtin'

