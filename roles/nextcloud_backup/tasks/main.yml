# Tasks for setting up Nextcloud S3 backups using restic
---
- name: Install tools for S3 backups
  ansible.builtin.apt:
    name:
      - restic
      - rclone
    state: present

- name: Create backup configuration directory
  ansible.builtin.file:
    path: /etc/nextcloud-backup
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Create backup working directory
  ansible.builtin.file:
    path: /var/backups/nextcloud
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write restic environment file
  ansible.builtin.copy:
    dest: /etc/nextcloud-backup/backup.env
    owner: root
    group: root
    mode: "0600"
    content: |
      RESTIC_REPOSITORY="s3:https://{{ nextcloud_s3_hostname }}/{{ nextcloud_backup_s3_bucket }}"
      RESTIC_PASSWORD="{{ nextcloud_backup_restic_password }}"
      AWS_ACCESS_KEY_ID="{{ nextcloud_s3_key }}"
      AWS_SECRET_ACCESS_KEY="{{ nextcloud_s3_secret }}"
      AWS_S3_FORCE_PATH_STYLE="true"
  no_log: true

- name: Install Nextcloud S3 backup script
  ansible.builtin.template:
    src: nextcloud-s3-backup.sh.j2
    dest: /usr/local/sbin/nextcloud-s3-backup.sh
    owner: root
    group: root
    mode: "0700"

- name: Create scheduled Nextcloud S3 backup
  ansible.builtin.cron:
    name: "Nextcloud S3 backup"
    minute: "{{ nextcloud_backup_cron_minute }}"
    hour: "{{ nextcloud_backup_cron_hour }}"
    user: root
    job: "/usr/local/sbin/nextcloud-s3-backup.sh >> /var/log/nextcloud-s3-backup.log 2>&1"
    cron_file: nextcloud-s3-backup
    state: present

- name: Ensure backup log file exists
  ansible.builtin.file:
    path: /var/log/nextcloud-s3-backup.log
    state: touch
    owner: root
    group: root
    mode: "0600"
