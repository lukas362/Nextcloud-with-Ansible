# Installs Nextcloud apps (put future apps here)
- name: Installation of Nextcloud apps (calendar, mail, mfa, talk, etc)
  ansible.builtin.command:
    cmd: php occ app:install "{{ item }}"                           # loop trought items listed below
    chdir: "{{ nextcloud_install_dir }}"
  become_user: www-data                                             # runs the command as www-data user, which is necessary for occ to work properly
  loop:
    - twofactor_totp
    - calendar
    - mail
    - spreed                                                        # aka TALK app
  register: apps_installed
  failed_when: false                                                # ignores errors about the apps already being installed
  changed_when: "'successfully installed' in apps_installed.stdout" # only shows as changed if the apps were actually installed, otherwise it will be skipped

# Needed to avoid Errors with the mail app
- name: Add missing database indices for mail feature
  ansible.builtin.command:
    cmd: php occ db:add-missing-indices                             # Command that adds all the missing database indices for the mail
    chdir: "{{ nextcloud_install_dir }}"
  become_user: www-data
  register: db_indices
  changed_when: "'added' in db_indices.stdout"                      # only shows as changed if indices were actually added, otherwise it will be skipped

# Enables the apps that were installed before
- name: Enable Nextcloud apps (calendar, mail, mfa, etc)
  ansible.builtin.command:
    cmd: php occ app:enable "{{ item }}"
    chdir: "{{ nextcloud_install_dir }}"
  become_user: www-data
  loop:
    - twofactor_totp
    - calendar
    - mail
    - spreed
  register: apps_enabled
  changed_when: "'enabled' in apps_enabled.stdout"                # only shows as changed if the apps were actually enabled, otherwise it will be skipped

# Checks so that the apps are actually running and working
- name: Check that Nextcloud apps are enabled
  ansible.builtin.command:
    cmd: php occ app:list --enabled
    chdir: "{{ nextcloud_install_dir }}"
  become_user: www-data
  register: apps_checking
  changed_when: false

# This will add the coturn server as a Talk STUN server, which is needed for the Talk app to work properly
- name: Add local coturn as Talk STUN server
  ansible.builtin.command:
    cmd: php occ talk:stun:add "{{ coturn_domain }}:{{ coturn_listening_port }}"
    chdir: "{{ nextcloud_install_dir }}"
  become_user: www-data
  register: talk_stun_add
  failed_when: false
  changed_when: "'already' not in (talk_stun_add.stdout | lower)"

# This will add the coturn server as a Talk TURN server for UDP and TCP, which is needed for the Talk app to work properly
- name: Add Talk TURN server for UDP and TCP
  ansible.builtin.command:
    cmd: >
      php occ talk:turn:add
      --secret "{{ coturn_static_secret }}"
      turn
      "{{ coturn_domain }}:{{ coturn_listening_port }}"
      udp,tcp
    chdir: "{{ nextcloud_install_dir }}"
  become_user: www-data
  register: talk_turn_add
  failed_when: false
  changed_when: "'already' not in (talk_turn_add.stdout | lower)"

# This will add the coturn server as a Talk TURNS server for TLS fallback, which is needed for the Talk app to work properly
- name: Add Talk TURNS server for TLS fallback
  ansible.builtin.command:
    cmd: >
      php occ talk:turn:add
      --secret "{{ coturn_static_secret }}"
      turns
      "{{ coturn_domain }}:{{ coturn_tls_listening_port }}"
      tcp
    chdir: "{{ nextcloud_install_dir }}"
  become_user: www-data
  when: coturn_tls | default(false)
  register: talk_turns_add
  failed_when: false
  changed_when: "'already' not in (talk_turns_add.stdout | lower)"

# Needed for the mail app to work, otherwise I get errors about missing database tables for the mail app
- name: Repair Nextcloud to initialize Mail app database
  ansible.builtin.command:
    cmd: php occ maintenance:repair
    chdir: "{{ nextcloud_install_dir }}"
  become_user: www-data
  changed_when: false

# This will set the mail account for the admin user, which is needed for the mail app to work properly, otherwise I get errors about missing mail
- name: Check if Nextcloud mail account for admin already exists
  ansible.builtin.command:
    cmd: php occ mail:account:export {{ nextcloud_admin_user }}
    chdir: "{{ nextcloud_install_dir }}"
  become_user: www-data
  register: mail_checking
  changed_when: false # reads only the information to find out if there is account or not
  failed_when: false

# Workaround from Nextcloud thread: write provisioning directly to oc_mail_provisionings
- name: Reset Mail provisioning rows
  ansible.builtin.command:
    cmd: >
      mysql
      -u{{ nextcloud_db_user }}
      -p{{ nextcloud_db_password }}
      -h {{ nextcloud_db_host }}
      -D {{ nextcloud_db_name }}
      -e "DELETE FROM oc_mail_provisionings WHERE provisioning_domain='{{ from_domain }}';"
  register: mail_provisioning_resetw
  changed_when: true
  no_log: true

  # This is for the provisioning configs of the mail app. This will aply to every user on the server, found in "groupware"
- name: Insert Mail provisioning row
  ansible.builtin.command:
    cmd: >
      mysql
      -u{{ nextcloud_db_user }}
      -p{{ nextcloud_db_password }}
      -h {{ nextcloud_db_host }}
      -D {{ nextcloud_db_name }}
      -e "
      INSERT INTO oc_mail_provisionings(
        id,
        provisioning_domain,
        email_template,
        imap_user,
        imap_host,
        imap_port,
        imap_ssl_mode,
        smtp_user,
        smtp_host,
        smtp_port,
        smtp_ssl_mode,
        ldap_aliases_provisioning,
        ldap_aliases_attribute
      ) VALUES (
        1,
        '{{ from_domain }}',
        '%EMAIL%',
        '%EMAIL%',
        '{{ imap_host }}',
        '{{ imap_port }}',
        '{{ imap_ssl_mode }}',
        '%EMAIL%',
        '{{ smtp_host }}',
        '{{ smtp_port }}',
        '{{ smtp_ssl_mode }}',
        '0',
        ''
      );"
  register: mail_provisioning_insert
  changed_when: true

