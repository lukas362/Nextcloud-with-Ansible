# This is were the mfa will be enforced for all users on the server
- name: Enforece mfa for all users
  ansible.builtin.command:
    cmd: php {{ nextcloud_install_dir }}/occ config:system:set twofactor_enforced --value=true    # This will enforce mfa for all users on the server
    chdir: "{{ nextcloud_install_dir }}"
  become_user: www-data
  register: mfa_enforced
  changed_when: false

# This is if you wanna exclude a specific group from mfa
# - name: Exclude specific group (e.g., admins) from enforcement
#    command: "php {{ nextcloud_install_dir }}/occ config:system:set twofactor_enforced_excluded_groups --value='[\"admin\"]'"

# Set Nextcloud to use cron for background jobs (required for proper operation)
- name: Set Nextcloud to use cron for background jobs
  ansible.builtin.command:
    cmd: php {{ nextcloud_install_dir }}/occ config:app:set core backgroundjobs_mode --value=cron
    chdir: "{{ nextcloud_install_dir }}"
  become_user: www-data
  register: cron_mode_set
  changed_when: "'cron' in cron_mode_set.stdout"

# Create the cron job to execute Nextcloud cron.php every 5 minutes (required for background jobs)
- name: Set up Nextcloud cron job
  ansible.builtin.cron:
    name: "Nextcloud cron"
    minute: "*/5"
    hour: "*"
    day: "*"
    month: "*"
    weekday: "*"
    user: "www-data"
    job: "php -f {{ nextcloud_install_dir }}/cron.php"
    cron_file: "nextcloud"
    state: present

# Mimetype migrations fix, updates the database mapping of file extensions to file types

- name: Update mimetype database
  ansible.builtin.command:
    cmd: php {{ nextcloud_install_dir }}/occ maintenance:mimetype:update-db
  become_user: www-data
  register: mimetype_db_result
  changed_when: "'Added' in mimetype_db_result.stdout or 'Updated' in mimetype_db_result.stdout"

- name: Update mimetypelist.js
  ansible.builtin.command:
    cmd: php {{ nextcloud_install_dir }}/occ maintenance:mimetype:update-js
  become_user: www-data
  register: mimetype_js_result
  changed_when: "'updated' in mimetype_js_result.stdout.lower()"

- name: Run maintenance repair
  ansible.builtin.command:
    cmd: php {{ nextcloud_install_dir }}/occ maintenance:repair --include-expensive
    chdir: "{{ nextcloud_install_dir }}"
  become_user: www-data
  changed_when: false
  timeout: 600  # allow up to 10 minutes

# This should fix Memcache configuration issues that can cause performance problems and errors in Nextcloud
- name: Configure local memcache with APCu
  ansible.builtin.command:
    cmd: php {{ nextcloud_install_dir }}/occ config:system:set memcache.local --value='\OC\Memcache\APCu'
  become_user: www-data
  changed_when: false

- name: Configure distributed memcache with Redis
  ansible.builtin.command:
    cmd: php {{ nextcloud_install_dir }}/occ config:system:set memcache.distributed --value='\OC\Memcache\Redis'
  become_user: www-data
  changed_when: false

- name: Configure locking memcache with Redis
  ansible.builtin.command:
    cmd: php {{ nextcloud_install_dir }}/occ config:system:set memcache.locking --value='\OC\Memcache\Redis'
  become_user: www-data
  changed_when: false

- name: Configure Redis host
  ansible.builtin.command:
    cmd: php {{ nextcloud_install_dir }}/occ config:system:set redis host --value='localhost'
  become_user: www-data
  changed_when: false

- name: Configure Redis port
  ansible.builtin.command:
    cmd: php {{ nextcloud_install_dir }}/occ config:system:set redis port --type=integer --value=6379
  become_user: www-data
  changed_when: false
