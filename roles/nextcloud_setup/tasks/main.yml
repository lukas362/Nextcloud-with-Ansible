# Installation of Nextcloud. Downloads, unpacks and sets up Nextcloud on the server
---
# This will go to the offcial nextcloud webbsite and download and put it in /temp/nextcloud
- name: Download Nextcloud
  ansible.builtin.get_url:
    url: "https://download.nextcloud.com/server/releases/nextcloud-{{ nextcloud_version }}.zip"
    dest: "/tmp/nextcloud-{{ nextcloud_version }}.zip"
    mode: "0644"

# this will extract the zip version of Nextcloud
- name: Extract Nextcloud
  ansible.builtin.unarchive:
    src: /tmp/nextcloud-{{ nextcloud_version }}.zip
    dest: /var/www/
    remote_src: true
    owner: www-data
    group: www-data

# This will create a data directory for Nextcloud on the server and will store files, photos, docs, etc
- name: Create data directory
  ansible.builtin.file:
    path: "{{ nextcloud_data_dir }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0750"

# Set permissions for Nextcloud directory
- name: Set permissions for Nextcloud
  ansible.builtin.file:
    path: "{{ nextcloud_install_dir }}"
    state: directory
    owner: www-data
    group: www-data
    recurse: true

# To ensure that Nextcloud can store files
- name: Ensure www-data has a place for temporary Ansible files
  ansible.builtin.file:
    path: /var/www/.ansible/tmp
    state: directory
    owner: www-data
    group: www-data
    mode: "0700"
    recurse: true

# This will install Nextcloud via the occ command (occ is nextclouds own cli), can't use special charachets or anything like that
- name: Install Nextcloud via occ command
  become_user: www-data
  ansible.builtin.command:
    cmd: >
      php occ maintenance:install
      --database "{{ nextcloud_db_type }}"
      --database-name "{{ nextcloud_db_name }}"
      --database-user "{{ nextcloud_db_user }}"
      --database-pass "{{ nextcloud_db_password }}"
      --admin-user "{{ nextcloud_admin_user }}"
      --admin-pass "{{ nextcloud_admin_password }}"
      --data-dir "{{ nextcloud_data_dir }}"
    chdir: "{{ nextcloud_install_dir }}"
    creates: "{{ nextcloud_install_dir }}/config/config.php"

# Configure S3 as primary object storage in Nextcloud runtime config
- name: Configure Nextcloud S3 objectstore class
  become_user: www-data
  ansible.builtin.command:
    argv:
      - php
      - occ
      - config:system:set
      - objectstore
      - class
      - --value=\OC\Files\ObjectStore\S3
    chdir: "{{ nextcloud_install_dir }}"
  changed_when: false

- name: Configure Nextcloud S3 objectstore non-sensitive arguments
  become_user: www-data
  ansible.builtin.command:
    argv:
      - php
      - occ
      - config:system:set
      - objectstore
      - arguments
      - "{{ item.key }}"
      - "--value={{ item.value }}"
      - "--type={{ item.type | default('string') }}"
    chdir: "{{ nextcloud_install_dir }}"
  loop:
    - { key: bucket, value: "{{ nextcloud_s3_bucket }}" }
    - { key: hostname, value: "{{ nextcloud_s3_hostname }}" }
    - { key: use_ssl, value: "true", type: "boolean" }
    - { key: use_path_style, value: "true", type: "boolean" }
  changed_when: false

- name: Configure Nextcloud S3 credentials
  become_user: www-data
  ansible.builtin.command:
    argv:
      - php
      - occ
      - config:system:set
      - objectstore
      - arguments
      - "{{ item.key }}"
      - "--value={{ item.value }}"
    chdir: "{{ nextcloud_install_dir }}"
  loop:
    - { key: key, value: "{{ nextcloud_s3_key }}" }
    - { key: secret, value: "{{ nextcloud_s3_secret }}" }
  changed_when: false
  no_log: true

- name: Verify Nextcloud S3 objectstore class is configured
  become_user: www-data
  ansible.builtin.command:
    argv:
      - php
      - occ
      - config:system:get
      - objectstore
      - class
    chdir: "{{ nextcloud_install_dir }}"
  register: nextcloud_objectstore_class_check
  changed_when: false
  failed_when: nextcloud_objectstore_class_check.rc != 0 or (nextcloud_objectstore_class_check.stdout | trim) != '\\OC\\Files\\ObjectStore\\S3'

- name: Set Nextcloud to use Pretty URLs
  become_user: www-data
  ansible.builtin.command:
    cmd: "php occ config:system:set overwrite.cli.url --value='https://{{ domains[0] }}'"
    chdir: "{{ nextcloud_install_dir }}"
  changed_when: false

# This will set the RewriteBase for Nextcloud, which is needed for the pretty URLs to work
- name: Set Nextcloud RewriteBase for clean URLs
  become_user: www-data
  ansible.builtin.command:
    cmd: "php occ config:system:set htaccess.RewriteBase --value='/'"
    chdir: "{{ nextcloud_install_dir }}"
  changed_when: false

# This will generate the .htaccess file for Nextcloud, which is needed for the pretty URLs to work
- name: Set trusted domains for Nextcloud
  become_user: www-data
  ansible.builtin.command:
    cmd: "php occ config:system:set trusted_domains {{ trusted_domain_index }} --value='{{ item }}'"
    chdir: "{{ nextcloud_install_dir }}"
  loop: "{{ nextcloud_trusted_domains | default(domains) }}"
  loop_control:
    index_var: trusted_domain_index
  changed_when: false

- name: Update hide index.php url
  become_user: www-data
  ansible.builtin.command:
    cmd: "php occ maintenance:update:htaccess"
    chdir: "{{ nextcloud_install_dir }}"
  changed_when: false

# Install the Nextcloud Office app (richdocuments) so users can edit documents
# occ will skip the install if it is already installed, so it is safe to run every time
- name: Install Nextcloud Office app
  ansible.builtin.command:
    cmd: php occ app:install richdocuments
    chdir: "{{ nextcloud_install_dir }}"
  become_user: www-data
  register: richdocuments_install
  failed_when: "'already installed' not in richdocuments_install.stdout"
  changed_when: "'installed' in richdocuments_install.stdout"       # runs when told to install the app if not already installed

# Make sure the app is active (otherwise I won't be able to use collabora)
- name: Enable Nextcloud Office app
  ansible.builtin.command:
    cmd: php occ app:enable richdocuments
    chdir: "{{ nextcloud_install_dir }}"
  become_user: www-data
  register: richdocuments_enable
  changed_when: "'enabled' in richdocuments_enable.stdout"          # runs when told to enable the app if not already enabled

# Verify that the app is enabled and working (otherwise I won't be able to use collabora)
- name: Check that Nextcloud Office app is enabled
  ansible.builtin.command:
    cmd: php occ app:list --enabled
    chdir: "{{ nextcloud_install_dir }}"
  become_user: www-data
  register: richdocuments_check
  changed_when: false
  failed_when: "'richdocuments' not in richdocuments_check.stdout"

# Builtin mode uses Nextcloud's bundled CODE app instead of external Docker Collabora
- name: Install built-in CODE app (richdocumentscode)
  ansible.builtin.command:
    cmd: php occ app:install richdocumentscode
    chdir: "{{ nextcloud_install_dir }}"
  become_user: www-data
  register: richdocumentscode_install
  failed_when: false
  changed_when: "'installed' in richdocumentscode_install.stdout"
  when: collabora_mode == "builtin"

# Enables the builtin CODE app
- name: Enable builtin CODE app (richdocumentscode)
  ansible.builtin.command:
    cmd: php occ app:enable richdocumentscode
    chdir: "{{ nextcloud_install_dir }}"
  become_user: www-data
  register: richdocumentscode_enable
  changed_when: "'enabled' in richdocumentscode_enable.stdout"
  when: collabora_mode == "builtin"

# Verifys that the builtin CODE app is working and enabled
- name: Verify built-in CODE app is enabled
  ansible.builtin.command:
    cmd: php occ app:list --enabled
    chdir: "{{ nextcloud_install_dir }}"
  become_user: www-data
  register: richdocumentscode_check
  changed_when: false
  failed_when: "'richdocumentscode' not in richdocumentscode_check.stdout"
  when: collabora_mode == "builtin"

# External mode collabora (leave commented while using builtin mode)
