# This role will handle the creation and configuration of new users on the Nextcloud server
# it will create a user with the specified username and password
# If you want to add more users then go to the group_vars/all.yml file and change the variables there and then run this playbook
---

# This will check if there already is a user with the same name, if there is it will skip the task
- name: Check if user already exists
  ansible.builtin.command:
    cmd: "php occ user:info {{ display_name }}"
    chdir: "{{ nextcloud_install_dir }}"
  become_user: www-data
  register: user_check
  failed_when: false
  changed_when: false

# Check that group exists
- name: Ensure groups exist
  ansible.builtin.command:
    cmd: "php occ group:add {{ item }}"
    chdir: "{{ nextcloud_install_dir }}"
  become_user: www-data
  loop: "{{ groups_to_add_user_to }}"
  register: group_create_result
  changed_when: "'created' in group_create_result.stdout"
  failed_when:
    - group_create_result.rc != 0
    - "'already exists' not in group_create_result.stdout"

- name: Ensure user is present with display name
  ansible.builtin.command:
    cmd: "php occ user:add --display-name='{{ display_name }}' --password-from-env {{ actual_name }}"
    chdir: "{{ nextcloud_install_dir }}"
  become_user: www-data
  environment:
    OC_PASS: "{{ pwd }}"          # This is were the password gets created
  when: user_check.rc != 0        # creates a user only if there isn't already a user with the same name, if there is it will skip this task
  changed_when: false

# This will delete a user based on the username (needs to run before "Add user to group")
# - name: Remove user
#  ansible.builtin.command:
#    cmd: "php occ user:delete {{ delete_user }}"
#    chdir: "{{ nextcloud_install_dir }}"
#  become_user: www-data
#  failed_when: false
#  changed_when: "'Deleted user' in remove_user_result.stdout"

- name: Add user to group
  ansible.builtin.command:
    cmd: "php occ group:adduser {{ item }} {{ actual_name }}"
    chdir: "{{ nextcloud_install_dir }}"
  become_user: www-data
  loop: "{{ groups_to_add_user_to }}"
  failed_when: false
  changed_when: false

# Saves the user's email address to their Nextcloud profile
# Only runs if you have set "user_email" in group_vars/all.yml
- name: Set profile email for new user
  ansible.builtin.command:
    cmd: "php occ user:setting {{ actual_name }} settings email {{ user_email }}"
    chdir: "{{ nextcloud_install_dir }}"
  become_user: www-data
  when: user_email is defined   # skip this task if user_email is not set
  changed_when: false

